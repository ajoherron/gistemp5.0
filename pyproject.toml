[project]
name = "gistemp5"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "xarray>=2023.7.0",
    "pandas",
    "numpy",
    "matplotlib",
    "requests",
    "tqdm",
    "netCDF4",
    "h5py",
    "pyarrow",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["steps", "tools", "parameters", "main"]
